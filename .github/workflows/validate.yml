name: validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  partial-bank-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - run: go test ./...
      - run: go run ./cmd/validate -root . -phase1 -run-commands
