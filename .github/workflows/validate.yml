name: validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  partial-bank-contracts:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
      GOPROXY: "off"
      GOSUMDB: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run ./cmd/validate -root . -phase1 -run-commands
      - run: go run ./cmd/task-check -root . -all
      - run: go run ./cmd/task-report -root . -check
