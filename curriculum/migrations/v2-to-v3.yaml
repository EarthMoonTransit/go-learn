additions:
    - id: channels.directional
      rationale: Directional channel types encode ownership and API permissions independently from runtime blocking.
    - id: interfaces.stringer-contract
      rationale: Implementing fmt.Stringer exposes receiver, formatting, and interface-contract mistakes not covered by general formatting.
    - id: slices.subslice-retention
      rationale: Small subslices can retain large backing arrays even when functional behavior is correct.
    - id: strings.formatting
      rationale: Format verbs and argument contracts form an independently testable standard-library boundary.
    - id: strings.standard-library
      rationale: Searching, splitting, trimming, and replacing with package strings is a distinct reusable API skill.
    - id: sync.data-races-happens-before
      rationale: Race freedom and happens-before reasoning are prerequisites for selecting synchronization primitives safely.
    - id: testing.deterministic-boundaries
      rationale: Deterministic control of time, randomness, scheduling, environment, and I/O is a prerequisite for trustworthy tests.
    - id: types.floating-point-semantics
      rationale: Floating-point representation, comparison, NaN, infinity, and rounding are independently testable and were a v2 gap.
legacy_task_references: []
