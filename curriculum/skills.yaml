            - implement
            - debug
            - test-writing
          minimum_occurrences:
            primary: 3
            total: 5
          mastery:
            - Predicts default typing and representability
            - Chooses typed or untyped constants without accidental overflow
          evidence_requirements:
            minimum_distinct_task_types: 3
            required_modes:
                - implementation
                - debugging
                - verification-or-integration
            observable_outcomes:
                - Predicts default typing and representability
                - Chooses typed or untyped constants without accidental overflow
          status: active
          assignable: true
          taxonomy_version: 3
        - id: types.iota-enumeration
          domain: types
          definition: Builds maintainable constant sequences with iota, repetition, offsets, and bit patterns.
          prerequisites:
