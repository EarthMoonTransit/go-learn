          common_misconceptions:
            - Short declarations work outside functions
            - Inferred values have no concrete type
          recommended_exercise_types:
            - implement
            - predict
            - debug
          minimum_occurrences:
            primary: 3
            total: 5
          mastery:
            - Chooses var, short declaration, or explicit type intentionally
            - Predicts scope and type of mixed short declarations
          evidence_requirements:
            minimum_distinct_task_types: 3
            required_modes:
