          evidence_requirements:
            minimum_distinct_task_types: 3
            required_modes:
                - implementation
                - debugging
                - verification-or-integration
            observable_outcomes:
                - Expands a nontrivial iota declaration correctly
                - Uses explicit types and expressions to keep an enumeration stable
