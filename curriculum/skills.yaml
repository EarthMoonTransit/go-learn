          evidence_requirements:
            minimum_distinct_task_types: 3
            required_modes:
                - implementation
                - debugging
                - verification-or-integration
            observable_outcomes:
                - Makes explicit conversions at type boundaries
                - Predicts truncation, overflow, and integer division
          status: active
          assignable: true
          taxonomy_version: 3
        - id: types.floating-point-semantics
          domain: types
          definition: Reasons about finite precision, rounding, NaN, infinity, and tolerance-based comparison.
          prerequisites:
            - types.numeric-conversions
            - expressions.comparison
          common_misconceptions:
            - Decimal fractions are represented exactly
            - NaN compares equal to itself
          recommended_exercise_types:
            - implement
            - debug
            - test-writing
          minimum_occurrences:
            primary: 3
            total: 5
          mastery:
            - Chooses a comparison strategy from the numeric contract
            - Tests rounding, exceptional values, and magnitude-sensitive error
          evidence_requirements:
            minimum_distinct_task_types: 3
            required_modes:
                - implementation
                - debugging
                - verification-or-integration
            observable_outcomes:
                - Chooses a comparison strategy from the numeric contract
                - Tests rounding, exceptional values, and magnitude-sensitive error
          status: active
          assignable: true
          taxonomy_version: 3
        - id: types.constants-iota
          domain: types
          definition: Historical taxonomy v2 umbrella. Typed and untyped constants do not require iota, while enumeration patterns add independent declaration semantics.
          prerequisites: []
          common_misconceptions: []
          recommended_exercise_types: []
          minimum_occurrences:
            primary: 0
            total: 0
          mastery: []
          evidence_requirements:
            minimum_distinct_task_types: 0
            required_modes: []
            observable_outcomes: []
          status: deprecated
          assignable: false
          taxonomy_version: 3
          replaced_by:
            - types.constants
            - types.iota-enumeration
        - id: types.constants
          domain: types
          definition: Uses typed and untyped constants while respecting representability and compile-time evaluation.
          prerequisites:
            - types.numeric-conversions
          common_misconceptions:
            - Every constant already has a machine representation
            - Constant arithmetic follows runtime overflow rules
