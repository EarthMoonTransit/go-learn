version: 3
track: go-fundamentals
target_ready_tasks:
    min: 350
    max: 500
coverage_policy:
    counted_status: ready
    primary_skill_per_task: 1
    prerequisite_counts_as_occurrence: false
    note: Taxonomy v3 uses 2/4, 3/5, or 4/6 encounter tiers according to breadth and failure risk; only active assignable skills count.
domains:
    - id: toolchain
      title: Toolchain
      skills:
        - id: toolchain.modules-workspaces
          domain: toolchain
          definition: Creates and edits a minimal go.mod deliberately
          prerequisites: []
          common_misconceptions:
            - A module is the same thing as a package
            - GOPATH is required for every project
          recommended_exercise_types:
            - implement
            - debug
            - predict
          minimum_occurrences:
            primary: 3
            total: 5
          mastery:
            - Creates and edits a minimal go.mod deliberately
            - Explains module, package, workspace, and import path boundaries
          evidence_requirements:
            minimum_distinct_task_types: 3
            required_modes:
                - implementation
                - debugging
                - verification-or-integration
            observable_outcomes:
                - Creates and edits a minimal go.mod deliberately
                - Explains module, package, workspace, and import path boundaries
          status: active
          assignable: true
          taxonomy_version: 3
        - id: toolchain.build-run
          domain: toolchain
          definition: Builds, runs, and tests the intended package
          prerequisites:
            - toolchain.modules-workspaces
          common_misconceptions:
            - go run and go build produce identical artifacts
            - Every package is executable
          recommended_exercise_types:
            - implement
            - debug
            - predict
          minimum_occurrences:
            primary: 3
            total: 5
          mastery:
            - Builds, runs, and tests the intended package
            - Diagnoses package and entry-point errors from tool output
          evidence_requirements:
            minimum_distinct_task_types: 3
            required_modes:
                - implementation
                - debugging
                - verification-or-integration
            observable_outcomes:
                - Builds, runs, and tests the intended package
                - Diagnoses package and entry-point errors from tool output
          status: active
          assignable: true
          taxonomy_version: 3
        - id: toolchain.formatting-vetting
          domain: toolchain
          definition: Uses gofmt/go fmt and interprets stable formatting
          prerequisites:
            - toolchain.build-run
          common_misconceptions:
            - Formatting is cosmetic and configurable per team
            - go vet proves program correctness
          recommended_exercise_types:
            - debug
            - refactor
            - predict
          minimum_occurrences:
            primary: 3
            total: 5
          mastery:
            - Uses gofmt/go fmt and interprets stable formatting
            - Uses vet findings as targeted diagnostics rather than a proof
          evidence_requirements:
            minimum_distinct_task_types: 3
            required_modes:
                - implementation
                - debugging
                - verification-or-integration
            observable_outcomes:
                - Uses gofmt/go fmt and interprets stable formatting
                - Uses vet findings as targeted diagnostics rather than a proof
          status: active
          assignable: true
          taxonomy_version: 3
        - id: toolchain.docs-environment
          domain: toolchain
          definition: Finds symbol documentation with go doc
          prerequisites:
            - toolchain.build-run
          common_misconceptions:
            - Documentation requires a browser
            - GOOS and GOARCH only affect file names
          recommended_exercise_types:
            - predict
            - debug
            - test-writing
          minimum_occurrences:
            primary: 3
            total: 5
          mastery:
            - Finds symbol documentation with go doc
            - Inspects relevant go env values and predicts build selection
          evidence_requirements:
            minimum_distinct_task_types: 3
            required_modes:
                - implementation
                - debugging
                - verification-or-integration
            observable_outcomes:
                - Finds symbol documentation with go doc
                - Inspects relevant go env values and predicts build selection
          status: active
          assignable: true
          taxonomy_version: 3
    - id: types
      title: Types, declarations, and constants
      skills:
