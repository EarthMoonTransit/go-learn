            - test-writing
          minimum_occurrences:
            primary: 3
            total: 5
          mastery:
            - States zero values for fundamental and composite types
            - Distinguishes valid zero values from nil values that reject writes
          evidence_requirements:
            minimum_distinct_task_types: 3
            required_modes:
