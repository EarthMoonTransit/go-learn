schema_version: 2
id: package-inventory-001
title: Implement exported fields and private state across packages
activity: implementation
submission:
    kind: workspace-patch
    editable_paths:
        - stock/item.go
        - subject/describe.go
    workspace_skeleton:
        - stock/doc.go
skills:
    primary: packages.imports-exports-naming
    secondary:
        - structs.field-visibility-tags
prerequisites:
    - methods.receiver-semantics
    - strings.formatting
    - structs.literals-zero
    - toolchain.modules-workspaces
new_concepts:
    - packages.imports-exports-naming
    - structs.field-visibility-tags
difficulty: basic
estimated_time_minutes:
    min: 15
    max: 30
verification:
    profile: workspace-tests
    packages:
        - ./...
    public_checks:
        - ./subject
    grader_checks:
        - ./subject
    reference_checks:
        - ./...
    required_mutants:
        - missing-fields
        - reset-onhand
        - swapped-accessors
        - copy-only-setter
        - wrong-summary
        - reset-sold
    race_required: false
    vet: true
    limits:
        command_timeout_seconds: 30
        determinism_runs: 2
        fuzz_seconds: 0
        benchmark_runs: 1
quality_status: ready
