    editable_paths:
        - model/record.go
        - subject/patch.go
    workspace_skeleton:
        - model/doc.go
        - subject/doc.go
skills:
    primary: encoding.json-shape-tags
    secondary:
        - structs.field-visibility-tags
prerequisites:
    - structs.literals-zero
    - packages.imports-exports-naming
    - methods.receiver-semantics
    - pointers.address-deref-nil
    - io.reader-writer-contracts
new_concepts: []
difficulty: intermediate
estimated_time_minutes:
    min: 25
    max: 45
verification:
    profile: workspace-tests
    packages:
        - ./subject
    public_checks:
        - ./subject
    grader_checks:
        - ./subject
    reference_checks:
        - ./subject
    required_mutants:
        - missing-tags
        - private-label
        - exported-secret
        - discard-secret
        - omit-empty-label
        - retain-zero-quantity
        - drop-negative-quantity
        - leak-secret
        - missing-zero-presence
        - null-clears
        - zero-ignored
        - reject-unknown
        - overwrite-secret
        - ignore-decode-error
        - apply-partial-on-error
        - reset-secret
    race_required: false
    vet: true
    limits:
        command_timeout_seconds: 30
        determinism_runs: 2
        fuzz_seconds: 0
        benchmark_runs: 1
