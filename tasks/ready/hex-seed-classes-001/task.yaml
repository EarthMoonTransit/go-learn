schema_version: 2
id: hex-seed-classes-001
title: Choose representative hexadecimal fuzz seeds
activity: fuzz-test-writing
submission:
    kind: tests
    editable_paths: []
    workspace_skeleton: []
skills:
    primary: fuzzing.targets-seeds
    secondary: []
prerequisites:
    - testing.basics-diagnostics
new_concepts:
    - fuzzing.targets-seeds
difficulty: basic
estimated_time_minutes:
    min: 15
    max: 30
verification:
    profile: fuzz-seed-tests
    packages:
        - ./subject
    public_checks:
        - ./subject
    grader_checks:
        - ./subject
    reference_checks:
        - ./subject
    required_mutants:
        - empty-status
        - zero-byte
        - high-bit
        - letter-case
        - byte-order
        - run-length
    race_required: true
    vet: true
    limits:
        command_timeout_seconds: 60
        determinism_runs: 2
        fuzz_seconds: 0
        benchmark_runs: 1
    fuzz:
        grammar: hex-codec-v1
        target: FuzzHex
        correct_variants:
            - loop
            - empty
quality_status: ready
